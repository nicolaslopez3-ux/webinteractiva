<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo 4: Regla de Simpson (1/3) - UTP</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
    <div class="container">
        <a href="../index.html" class="btn-back">← Volver al Inicio</a>
        <h1>Módulo 4: Regla de Simpson 1/3</h1>
        <p>Aproximación cuadrática (requiere que n sea par).</p>

        <div class="card">
            <h3>Parámetros de Entrada</h3>
            <form id="calc-form">
                <label>Función f(x):</label>
                <input type="text" id="fx" value="x^2">
                
                <label>Límite inferior (a):</label>
                <input type="number" id="limit-a" value="0" step="any">
                
                <label>Límite superior (b):</label>
                <input type="number" id="limit-b" value="2" step="any">
                
                <label>Subintervalos (n par):</label>
                <input type="number" id="sub-n" value="4" min="2" step="2">
                
                <button type="button" onclick="calcularSimpson()">Calcular Simpson</button>
            </form>
        </div>

        <div class="card">
            <h3>Resultado y Procedimiento</h3>
            <div id="salida">Ingresa los datos y presiona calcular.</div>
        </div>
    </div>

    <script>
        function evaluar(fxStr, x) {
            let expr = fxStr.replace(/x/g, `(${x})`).replace(/\^/g, '**');
            return eval(expr);
        }

        function calcularSimpson() {
            const fx = document.getElementById('fx').value;
            const a = parseFloat(document.getElementById('limit-a').value);
            const b = parseFloat(document.getElementById('limit-b').value);
            const n = parseInt(document.getElementById('sub-n').value);

            if (n % 2 !== 0) {
                alert("Para la Regla de Simpson, el número de subintervalos (n) debe ser PAR.");
                return;
            }

            const h = (b - a) / n;
            let suma = evaluar(fx, a) + evaluar(fx, b);
            let detalle = `<p><b>Δx (h):</b> ${h}</p><ul>`;

            for (let i = 1; i < n; i++) {
                let xi = a + i * h;
                let coef = (i % 2 === 1) ? 4 : 2;
                let val = coef * evaluar(fx, xi);
                suma += val;
                detalle += `<li>${coef} * f(x${i} = ${xi.toFixed(4)}) = ${val.toFixed(4)}</li>`;
            }

            detalle += `</ul>`;
            const resultado = (h / 3) * suma;

            document.getElementById('salida').innerHTML = `
                ${detalle}
                <h4><b>Resultado S${n}:</b> ${resultado.toFixed(6)}</h4>
            `;
        }
    </script>
</body>
</html>
